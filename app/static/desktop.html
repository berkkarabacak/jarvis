<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis</title>
  <meta name="theme-color" content="#efece8" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <!--
    Windows 3-pane product chrome (issues #74 / #67 / #68 / #69).
    New route on purpose: /ceo stays the orb Talk + Settings page.
    #68 embeds http://127.0.0.1:6080/vnc.html?autoconnect=1&resize=scale
    in #live-computer via an iframe. BrowserView is not used: it sits
    above the page and would need manual bounds on collapse.
    Hide / Chat only blanks the iframe. Do not kill jarvis-computer.
    #69 middle pane is the live You / Jarvis chat: /api/jarvis/ask,
    /api/jarvis/talk/last, and mic listen (browser speech or hidden /ceo).
  -->
  <style>
    :root {
      --page: #ddd6cc;
      --panel: #ffffff;
      --ink: #1c1917;
      --muted: #6b6560;
      --line: #d7d0c7;
      --soft: #f6f3ef;
      --accent: #1d4ed8;
      --accent-ink: #fff;
      --chip: #ece7e1;
      --shadow: 0 8px 24px rgba(28, 25, 23, 0.12);
      --radius: 20px;
      --left: 280px;
      --right: 340px;
      --ui: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--page);
      color: var(--ink);
      font: 15px/1.4 var(--ui);
    }
    body { overflow: hidden; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app {
      height: 100%;
      display: flex;
      gap: 16px;
      padding: 16px;
      min-width: 0;
    }
    .pane {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #left {
      flex: 0 1 var(--left);
      width: var(--left);
      max-width: 32%;
    }
    #middle {
      flex: 1 1 360px;
      min-width: 280px;
    }
    #right {
      flex: 0 1 var(--right);
      width: var(--right);
      max-width: 36%;
    }
    body.left-collapsed #left,
    body.right-collapsed #right {
      display: none;
    }
    .pane-head, .chat-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 14px 10px;
    }
    .pane-head h1, .pane-head h2, .chat-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      flex: 1;
    }
    .icon-btn, .text-btn {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 999px;
      min-height: 32px;
      padding: 0 10px;
      color: var(--ink);
    }
    .icon-btn {
      width: 32px;
      padding: 0;
      display: grid;
      place-items: center;
    }
    .icon-btn:hover, .text-btn:hover { background: #fff; }
    .search-wrap { padding: 0 14px 12px; }
    .search-wrap input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 999px;
      min-height: 38px;
      padding: 0 14px 0 36px;
      outline: none;
    }
    .search {
      position: relative;
    }
    .search::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 11px;
      width: 12px;
      height: 12px;
      border: 2px solid var(--muted);
      border-radius: 50%;
    }
    .search::after {
      content: "";
      position: absolute;
      left: 24px;
      top: 22px;
      width: 7px;
      height: 2px;
      background: var(--muted);
      transform: rotate(45deg);
    }
    .section {
      padding: 4px 14px 10px;
      overflow: auto;
    }
    .section h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .agents {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .agent, .row, .routine, .footer-btn {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 14px;
      text-align: left;
    }
    .agent {
      padding: 10px 10px 12px;
      display: grid;
      gap: 6px;
      justify-items: start;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
    .agent strong, .row strong { font-size: 13px; }
    .agent span, .row span, .hint, .routine span {
      color: var(--muted);
      font-size: 12px;
    }
    .list { display: grid; gap: 6px; }
    .row, .routine, .footer-btn {
      width: 100%;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex: 0 0 auto;
    }
    .left-foot {
      margin-top: auto;
      padding: 12px 14px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--line);
    }
    .footer-btn { flex: 1; justify-content: center; }
    .chat-head .who { display: grid; gap: 2px; flex: 1; }
    .chat-head .who span { color: var(--muted); font-size: 12px; }
    .thread {
      flex: 1;
      overflow: auto;
      padding: 18px 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 16rem;
    }
    .msg {
      display: grid;
      gap: 4px;
      max-width: 85%;
    }
    .msg.you {
      margin-left: auto;
      align-self: flex-end;
      justify-items: end;
    }
    .msg.jarvis {
      align-self: flex-start;
      justify-items: start;
    }
    .msg-who {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .msg p {
      margin: 0;
      padding: 10px 14px;
      border-radius: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .msg.you p {
      background: var(--accent);
      color: var(--accent-ink);
      border-radius: 16px 16px 4px 16px;
    }
    .msg.jarvis p {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 16px 16px 16px 4px;
    }
    .msg.pending p { color: var(--muted); }
    .agent[data-on="1"], .row[data-on="1"] {
      border-color: #93c5fd;
      background: #dbeafe;
    }
    .composer {
      padding: 12px 14px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .composer input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 999px;
      min-height: 44px;
      padding: 0 16px;
      outline: none;
    }
    .send {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    .screen {
      position: relative;
      margin: 0 14px;
      border-radius: 16px;
      background: #111;
      color: #f5f5f4;
      flex: 1 1 auto;
      min-height: 220px;
      overflow: hidden;
      display: grid;
      place-items: center;
      text-align: center;
    }
    #live-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    #screen-idle {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 10px;
      padding: 20px;
    }
    html[data-talk-mode="terminal"] .screen,
    html[data-pc="off"] .screen:not([hidden]) {
      background: #f6f3ef;
      color: var(--muted);
      border: 1px dashed var(--line);
    }
    .screen p { margin: 0; max-width: 16rem; }
    .screen .text-btn { color: var(--ink); }
    .terminal-note {
      margin: 8px 14px 0;
    }
    .screen-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 14px 0;
    }
    html[data-talk-mode="terminal"] .screen-actions {
      display: none;
    }
    [hidden] { display: none !important; }
    .modes {
      display: flex;
      gap: 6px;
      padding: 10px 14px 0;
    }
    .modes button[data-on="1"],
    #mic[data-on="1"] {
      background: #dbeafe;
      border-color: #93c5fd;
    }
    .edge {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      display: none;
    }
    body.left-collapsed #show-left,
    body.right-collapsed #show-right { display: grid; }
    #show-left { left: 8px; }
    #show-right { right: 8px; }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
  </style>
</head>
<body>
  <div class="sr" id="status" aria-live="polite">Jarvis is ready</div>
  <button type="button" class="icon-btn edge" id="show-left" aria-label="Show chats">‹</button>
  <button type="button" class="icon-btn edge" id="show-right" aria-label="Show computer">›</button>
  <div class="app" id="app">
    <aside class="pane" id="left" aria-label="Chats">
      <div class="pane-head">
        <h1>Jarvis</h1>
        <button type="button" class="icon-btn" id="hide-left" aria-label="Hide chats">‹</button>
      </div>
      <div class="search-wrap">
        <div class="search">
          <input id="search" type="search" placeholder="Search" aria-label="Search" autocomplete="off" />
        </div>
      </div>
      <div class="section">
        <h3>Helpers</h3>
        <div class="agents" id="agents">
          <button type="button" class="agent" data-id="jarvis">
            <span class="avatar" style="background:#1d4ed8">J</span>
            <strong>Jarvis</strong>
            <span>Coming soon</span>
          </button>
          <button type="button" class="agent" data-id="writer">
            <span class="avatar" style="background:#0f766e">W</span>
            <strong>Writer</strong>
            <span>Coming soon</span>
          </button>
          <button type="button" class="agent" data-id="helper">
            <span class="avatar" style="background:#b45309">H</span>
            <strong>Helper</strong>
            <span>Coming soon</span>
          </button>
          <button type="button" class="agent" data-id="finder">
            <span class="avatar" style="background:#7c3aed">F</span>
            <strong>Finder</strong>
            <span>Coming soon</span>
          </button>
        </div>
      </div>
      <div class="section">
        <h3>Chats</h3>
        <div class="list" id="chats">
          <button type="button" class="row" data-id="buyra"><span class="dot"></span><span><strong>Buyra</strong><br /><span>Placeholder chat</span></span></button>
          <button type="button" class="row" data-id="home"><span class="dot"></span><span><strong>Home</strong><br /><span>Placeholder chat</span></span></button>
        </div>
      </div>
      <div class="section">
        <h3>Group chats</h3>
        <div class="list" id="groups">
          <button type="button" class="row" data-id="family"><span class="dot"></span><span><strong>Family</strong><br /><span>Placeholder group</span></span></button>
        </div>
      </div>
      <div class="left-foot">
        <button type="button" class="footer-btn" id="plugins">Plugins</button>
        <button type="button" class="footer-btn" id="profile">You</button>
      </div>
    </aside>

    <main class="pane" id="middle" aria-label="Chat" data-chat="live">
      <div class="chat-head">
        <div class="who">
          <h2 id="chat-title">Jarvis</h2>
          <span id="chat-sub">Ready when you are</span>
        </div>
        <button type="button" class="icon-btn" id="settings" aria-label="Settings" title="Settings">⚙</button>
      </div>
      <div class="thread" id="thread" aria-live="polite">
        <p class="empty" id="empty-chat">This chat is ready. Messages will show up here.</p>
        <div class="msg jarvis pending" id="pending" hidden>
          <span class="msg-who">Jarvis</span>
          <p id="pending-copy">Jarvis is thinking…</p>
        </div>
      </div>
      <form class="composer" id="composer">
        <button type="button" class="icon-btn" id="add" aria-label="Add" title="Add">+</button>
        <input id="ask" type="text" placeholder="Type a message" aria-label="Type a message" autocomplete="off" />
        <button type="button" class="icon-btn" id="mic" aria-label="Talk" title="Talk">🎤</button>
        <button type="submit" class="icon-btn send" id="send" aria-label="Send" title="Send">➤</button>
      </form>
    </main>

    <aside class="pane" id="right" aria-label="Computer">
      <div class="pane-head">
        <h2>Jarvis's screen</h2>
        <button type="button" class="icon-btn" id="hide-right" aria-label="Hide computer">›</button>
      </div>
      <div class="modes" role="group" aria-label="Computer or chat only">
        <button type="button" class="text-btn" id="mode-computer" data-talk-mode="computer">Computer</button>
        <button type="button" class="text-btn" id="mode-terminal" data-talk-mode="terminal">Chat only</button>
      </div>
      <p class="hint terminal-note" id="terminal-note" hidden>Chat only — the computer stays hidden.</p>
      <div class="screen-actions" id="screen-actions">
        <button type="button" class="text-btn" id="hide-screen" aria-label="Hide screen">Hide screen</button>
        <button type="button" class="text-btn" id="show-screen" aria-label="Show screen" hidden>Show Jarvis's screen</button>
        <button type="button" class="text-btn" id="open-screen">Open Jarvis's screen</button>
      </div>
      <div class="screen" id="live-computer" data-embed="iframe" aria-label="Jarvis's screen">
        <iframe id="live-frame" title="Jarvis's screen" src="" hidden></iframe>
        <div id="screen-idle">
          <p id="screen-copy">Checking Jarvis's screen…</p>
          <button type="button" class="text-btn" id="start-computer">Start Jarvis's computer</button>
        </div>
      </div>
      <div class="section">
        <h3>Routines</h3>
        <div class="list" id="routines">
          <button type="button" class="routine"><strong>Morning briefing</strong><span>Coming soon</span></button>
          <button type="button" class="routine"><strong>Evening wrap</strong><span>Coming soon</span></button>
        </div>
      </div>
    </aside>
  </div>
  <script>
    (function () {
      var STORAGE = "jarvis.shell.panes";
      var SCREEN_STORAGE = "jarvis.shell.pcVisible";
      var SESSION = "http://127.0.0.1:6080/vnc.html?autoconnect=1&resize=scale";
      var statusEl = document.getElementById("status");
      var screenCopy = document.getElementById("screen-copy");
      var modeComputer = document.getElementById("mode-computer");
      var modeTerminal = document.getElementById("mode-terminal");
      var liveSlot = document.getElementById("live-computer");
      var liveFrame = document.getElementById("live-frame");
      var screenIdle = document.getElementById("screen-idle");
      var startBtn = document.getElementById("start-computer");
      var hideScreenBtn = document.getElementById("hide-screen");
      var showScreenBtn = document.getElementById("show-screen");
      var terminalNote = document.getElementById("terminal-note");
      var talkMode = "computer";
      var screenShown = true;
      var ASK_PATH = "/api/jarvis/ask";
      var TALK_LAST_PATH = "/api/jarvis/talk/last";
      var TALK_LOG_PATH = "/api/jarvis/talk/log";
      var SPEAK_PATH = "/api/jarvis/speak";
      var MAX_ASK = 240;
      var turns = [];
      var sending = false;
      var engineHeard = false;
      var browserRec = null;
      var browserListenOn = false;
      var threadEl = document.getElementById("thread");
      var emptyChat = document.getElementById("empty-chat");
      var pendingEl = document.getElementById("pending");
      var pendingCopy = document.getElementById("pending-copy");
      var askInput = document.getElementById("ask");
      var sendBtn = document.getElementById("send");
      var micBtn = document.getElementById("mic");
      var chatTitle = document.getElementById("chat-title");
      var chatSub = document.getElementById("chat-sub");

      function say(text) {
        statusEl.textContent = text;
      }

      function normalizePaneState(raw) {
        var src = raw && typeof raw === "object" ? raw : {};
        return { left: src.left !== false, right: src.right !== false };
      }

      function readPanes() {
        try {
          return normalizePaneState(JSON.parse(localStorage.getItem(STORAGE) || "null"));
        } catch (e) {
          return { left: true, right: true };
        }
      }

      function readScreenShown() {
        try {
          var raw = sessionStorage.getItem(SCREEN_STORAGE);
          if (raw === "0") return false;
          if (raw === "1") return true;
        } catch (e) {}
        return true;
      }

      function persistScreenShown() {
        try { sessionStorage.setItem(SCREEN_STORAGE, screenShown ? "1" : "0"); } catch (e) {}
      }

      function fitPanesToWidth(width, state) {
        var next = normalizePaneState(state);
        if (width > 0 && width < 900) return { left: false, right: false };
        return next;
      }

      function paintPanes(state) {
        document.body.classList.toggle("left-collapsed", !state.left);
        document.body.classList.toggle("right-collapsed", !state.right);
        syncLiveComputer();
      }

      function savePanes(state) {
        try { localStorage.setItem(STORAGE, JSON.stringify(state)); } catch (e) {}
        paintPanes(state);
      }

      function frameIsLive() {
        var src = (liveFrame && liveFrame.getAttribute("src")) || "";
        return !!src && src !== "about:blank";
      }

      function clearLiveFrame() {
        if (!liveFrame) return;
        try { liveFrame.setAttribute("src", "about:blank"); } catch (e) {}
        try { liveFrame.removeAttribute("src"); } catch (e) {}
        try { liveFrame.setAttribute("src", ""); } catch (e) {}
        liveFrame.hidden = true;
      }

      function computerShouldShow() {
        return talkMode !== "terminal" && panes.right && screenShown;
      }

      function showLiveFrame() {
        if (!liveFrame) return;
        screenIdle.hidden = true;
        liveFrame.hidden = false;
        if (liveFrame.getAttribute("src") !== SESSION) {
          liveFrame.setAttribute("src", SESSION);
        }
      }

      function showIdle(message, canStart) {
        clearLiveFrame();
        screenIdle.hidden = false;
        screenCopy.textContent = message || "Jarvis's computer is not running.";
        startBtn.hidden = !canStart;
      }

      function loadLiveScreen() {
        if (!computerShouldShow()) return;
        if (frameIsLive()) return;
        fetch("/api/jarvis/computer/screen", { credentials: "same-origin" })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (!computerShouldShow()) return;
            if (data && data.running) {
              showLiveFrame();
              return;
            }
            showIdle((data && data.error) || "Jarvis's computer is not running.", true);
          })
          .catch(function () {
            if (!computerShouldShow()) return;
            showIdle("Could not check Jarvis's computer.", true);
          });
      }

      function syncLiveComputer() {
        var show = computerShouldShow();
        var terminal = talkMode === "terminal";
        document.documentElement.setAttribute("data-talk-mode", talkMode);
        document.documentElement.setAttribute("data-pc", show ? "on" : "off");
        modeComputer.setAttribute("data-on", talkMode === "computer" ? "1" : "0");
        modeTerminal.setAttribute("data-on", terminal ? "1" : "0");
        liveSlot.hidden = !show;
        hideScreenBtn.hidden = !show;
        showScreenBtn.hidden = show || terminal;
        terminalNote.hidden = !terminal;
        if (!show) {
          clearLiveFrame();
          screenCopy.textContent = terminal
            ? "Chat only — the computer stays hidden."
            : "Jarvis's screen is hidden. The computer keeps running.";
          startBtn.hidden = true;
          return;
        }
        loadLiveScreen();
      }

      function applyTalkMode(value) {
        talkMode = String(value || "").toLowerCase() === "terminal" ? "terminal" : "computer";
        if (talkMode === "terminal") screenShown = false;
        persistScreenShown();
        syncLiveComputer();
        return talkMode;
      }

      function setScreenShown(on) {
        if (talkMode === "terminal") return;
        screenShown = !!on;
        persistScreenShown();
        syncLiveComputer();
      }

      var panes = fitPanesToWidth(window.innerWidth, readPanes());
      screenShown = readScreenShown();
      paintPanes(panes);

      document.getElementById("hide-left").addEventListener("click", function () {
        panes = { left: false, right: panes.right };
        savePanes(panes);
      });
      document.getElementById("show-left").addEventListener("click", function () {
        panes = { left: true, right: panes.right };
        savePanes(panes);
      });
      document.getElementById("hide-right").addEventListener("click", function () {
        panes = { left: panes.left, right: false };
        savePanes(panes);
      });
      document.getElementById("show-right").addEventListener("click", function () {
        panes = { left: panes.left, right: true };
        savePanes(panes);
      });

      window.addEventListener("resize", function () {
        var next = fitPanesToWidth(window.innerWidth, readPanes());
        panes = next;
        paintPanes(panes);
      });

      function openSettings() {
        if (window.jarvisDesktop && typeof window.jarvisDesktop.openSettings === "function") {
          window.jarvisDesktop.openSettings();
          return;
        }
        location.href = "/ceo?settings=1&desktop=1";
      }
      document.getElementById("settings").addEventListener("click", openSettings);

      function openScreen() {
        if (window.jarvisDesktop && typeof window.jarvisDesktop.openScreen === "function") {
          window.jarvisDesktop.openScreen();
          return;
        }
        window.open("/ceo/jarvis-screen", "jarvis-screen");
      }
      document.getElementById("open-screen").addEventListener("click", openScreen);
      hideScreenBtn.addEventListener("click", function () { setScreenShown(false); });
      showScreenBtn.addEventListener("click", function () { setScreenShown(true); });
      startBtn.addEventListener("click", function () {
        startBtn.disabled = true;
        startBtn.textContent = "Starting…";
        screenCopy.textContent = "Starting the one existing computer. This is not a screenshot.";
        fetch("/api/jarvis/computer/screen/start", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            var data = res.j || {};
            startBtn.disabled = false;
            startBtn.textContent = "Start Jarvis's computer";
            if (!computerShouldShow()) return;
            if (data.running) {
              showLiveFrame();
              return;
            }
            showIdle(data.error || "Jarvis's computer is not running.", true);
          })
          .catch(function () {
            startBtn.disabled = false;
            startBtn.textContent = "Start Jarvis's computer";
            if (!computerShouldShow()) return;
            showIdle("Could not start Jarvis's computer.", true);
          });
      });

      function clipAsk(text) {
        var s = String(text || "").replace(/\s+/g, " ").trim();
        if (s.length <= MAX_ASK) return s;
        return s.slice(0, MAX_ASK).trimEnd();
      }

      function paintThread() {
        threadEl.querySelectorAll(".msg:not(#pending)").forEach(function (node) {
          node.remove();
        });
        emptyChat.hidden = turns.length > 0 || sending || browserListenOn;
        turns.forEach(function (turn) {
          var wrap = document.createElement("div");
          wrap.className = "msg " + turn.role;
          wrap.setAttribute("data-role", turn.role);
          var who = document.createElement("span");
          who.className = "msg-who";
          who.textContent = turn.role === "you" ? "You" : "Jarvis";
          var body = document.createElement("p");
          body.textContent = turn.text;
          wrap.appendChild(who);
          wrap.appendChild(body);
          threadEl.insertBefore(wrap, pendingEl);
        });
        threadEl.scrollTop = threadEl.scrollHeight;
      }

      function rememberTurn(role, text) {
        var who = role === "you" ? "you" : "jarvis";
        var clean = who === "you" ? clipAsk(text) : String(text || "").replace(/\s+/g, " ").trim();
        if (!clean) return false;
        var last = turns[turns.length - 1];
        if (last && last.role === who && last.text === clean) return false;
        turns.push({ role: who, text: clean });
        paintThread();
        return true;
      }

      function setPending(on, label) {
        pendingEl.hidden = !on;
        if (on) pendingCopy.textContent = label || "Jarvis is thinking…";
        emptyChat.hidden = turns.length > 0 || on || browserListenOn;
        threadEl.scrollTop = threadEl.scrollHeight;
      }

      function setChatSub(text) {
        chatSub.textContent = text || "Ready when you are";
      }

      function postTalkLog(role, text) {
        var who = role === "you" ? "you" : "jarvis";
        var clean = who === "you" ? clipAsk(text) : String(text || "").replace(/\s+/g, " ").trim();
        if (!clean) return;
        fetch(TALK_LOG_PATH, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role: who, text: clean }),
        }).catch(function () {});
      }

      function playSpeak(text) {
        var clean = String(text || "").replace(/\s+/g, " ").trim();
        if (!clean) return;
        fetch(SPEAK_PATH, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: clean }),
        })
          .then(function (r) { return r.ok ? r.blob() : null; })
          .then(function (blob) {
            if (!blob) return;
            var url = URL.createObjectURL(blob);
            var audio = new Audio(url);
            audio.play().catch(function () {});
          })
          .catch(function () {});
      }

      function speakReply(text) {
        if (!text) return;
        if (window.jarvisDesktop && typeof window.jarvisDesktop.getMuted === "function") {
          window.jarvisDesktop.getMuted()
            .then(function (state) {
              if (state && state.muted) return;
              playSpeak(text);
            })
            .catch(function () { playSpeak(text); });
          return;
        }
        playSpeak(text);
      }

      function mergeHistory(rows) {
        var incoming = [];
        (Array.isArray(rows) ? rows : []).forEach(function (row) {
          if (!row || (row.role !== "you" && row.role !== "jarvis")) return;
          var clean = String(row.text || "").replace(/\s+/g, " ").trim();
          if (!clean) return;
          incoming.push({ role: row.role, text: row.role === "you" ? clipAsk(clean) : clean });
        });
        if (!incoming.length) return;
        if (!turns.length) {
          turns = incoming;
          paintThread();
          return;
        }
        if (sending) return;
        if (incoming.length >= turns.length) {
          turns = incoming;
          paintThread();
        }
      }

      function loadHistory() {
        fetch(TALK_LAST_PATH, { credentials: "same-origin" })
          .then(function (r) { return r.ok ? r.json() : {}; })
          .then(function (data) {
            if (sending) return;
            mergeHistory(data && data.turns);
          })
          .catch(function () {});
      }

      function applyTalkEvent(event) {
        var src = event && typeof event === "object" ? event : {};
        if (src.you) {
          engineHeard = true;
          stopBrowserListen();
          rememberTurn("you", src.you);
          postTalkLog("you", src.you);
        }
        if (src.reply) {
          rememberTurn("jarvis", src.reply);
          postTalkLog("jarvis", src.reply);
          setPending(false);
          sending = false;
          sendBtn.disabled = false;
          setChatSub("Ready when you are");
          return;
        }
        if (src.status === "listening") {
          setChatSub("Listening…");
          setPending(false);
          return;
        }
        if (src.status === "thinking") {
          sending = true;
          setPending(true, "Jarvis is thinking…");
          setChatSub("Jarvis is thinking…");
        }
      }

      function sendAsk(text) {
        var asked = clipAsk(text);
        if (!asked || sending) return;
        sending = true;
        sendBtn.disabled = true;
        rememberTurn("you", asked);
        askInput.value = "";
        setPending(true, "Jarvis is thinking…");
        setChatSub("Jarvis is thinking…");
        say("Sending…");
        fetch(ASK_PATH, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: asked }),
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            var data = (res && res.j) || {};
            var ui = data.ui != null ? data.ui : data.result;
            var reply = String((data.reply || (ui && ui.summary) || "")).replace(/\s+/g, " ").trim();
            sending = false;
            sendBtn.disabled = false;
            setPending(false);
            if (reply) {
              rememberTurn("jarvis", reply);
              setChatSub("Ready when you are");
              speakReply(reply);
              return;
            }
            setChatSub("Can't talk right now");
            say("Can't talk right now");
          })
          .catch(function () {
            sending = false;
            sendBtn.disabled = false;
            setPending(false);
            setChatSub("Can't talk right now");
            say("Can't talk right now");
          });
      }

      function stopBrowserListen() {
        browserListenOn = false;
        if (browserRec) {
          try { browserRec.onresult = null; browserRec.onend = null; browserRec.stop(); } catch (e) {}
        }
        browserRec = null;
        micBtn.setAttribute("data-on", "0");
      }

      function startBrowserListen() {
        var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Ctor) {
          if (!(window.jarvisDesktop && window.jarvisDesktop.startListen)) {
            setChatSub("Talk needs a microphone.");
            say("Talk needs a microphone.");
          }
          return;
        }
        stopBrowserListen();
        browserListenOn = true;
        engineHeard = false;
        micBtn.setAttribute("data-on", "1");
        emptyChat.hidden = turns.length > 0 || sending;
        browserRec = new Ctor();
        browserRec.continuous = false;
        browserRec.interimResults = false;
        browserRec.lang = "en-US";
        browserRec.onresult = function (e) {
          var said = ((e.results[0] && e.results[0][0] && e.results[0][0].transcript) || "").trim();
          stopBrowserListen();
          if (engineHeard) return;
          if (said) sendAsk(said);
        };
        browserRec.onerror = function () {
          stopBrowserListen();
          if (!engineHeard && !sending) setChatSub("Ready when you are");
        };
        browserRec.onend = function () {
          if (!browserListenOn) return;
          stopBrowserListen();
          if (!engineHeard && !sending) setChatSub("Ready when you are");
        };
        try { browserRec.start(); } catch (e) {
          stopBrowserListen();
        }
      }

      function startListen() {
        engineHeard = false;
        setChatSub("Listening…");
        say("Listening…");
        if (window.jarvisDesktop && typeof window.jarvisDesktop.startListen === "function") {
          window.jarvisDesktop.startListen();
        }
        startBrowserListen();
      }

      function selectLead(id, name, ready) {
        var title = name || "Jarvis";
        chatTitle.textContent = title;
        setChatSub(ready === false ? "Coming soon" : "Ready when you are");
        document.querySelectorAll(".agent[data-id], .row[data-id]").forEach(function (btn) {
          btn.setAttribute("data-on", btn.getAttribute("data-id") === id ? "1" : "0");
        });
        say(ready === false ? title + " is coming soon." : "Talking with " + title + ".");
      }

      document.getElementById("composer").addEventListener("submit", function (e) {
        e.preventDefault();
        sendAsk(askInput.value);
      });
      micBtn.addEventListener("click", function () {
        if (browserListenOn) {
          stopBrowserListen();
          setChatSub("Ready when you are");
          return;
        }
        startListen();
      });
      document.getElementById("add").addEventListener("click", function () {
        say("Photos and files come later.");
        setChatSub("Photos and files come later.");
      });
      document.getElementById("agents").addEventListener("click", function (e) {
        var btn = e.target.closest(".agent[data-id]");
        if (!btn) return;
        selectLead(btn.getAttribute("data-id"), btn.querySelector("strong") && btn.querySelector("strong").textContent, btn.getAttribute("data-id") === "jarvis");
      });
      document.getElementById("chats").addEventListener("click", function (e) {
        var btn = e.target.closest(".row[data-id]");
        if (!btn) return;
        selectLead(btn.getAttribute("data-id"), btn.querySelector("strong") && btn.querySelector("strong").textContent, true);
      });
      ["groups", "plugins", "profile", "routines"].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("click", function () {
          say("This list is a placeholder.");
        });
      });
      if (window.jarvisDesktop && typeof window.jarvisDesktop.onTalk === "function") {
        window.jarvisDesktop.onTalk(applyTalkEvent);
      }
      loadHistory();
      setInterval(function () {
        if (!sending) loadHistory();
      }, 4000);
      selectLead("jarvis", "Jarvis", true);

      function persistTalkMode(next) {
        applyTalkMode(next);
        fetch("/api/jarvis/settings", {
          method: "PUT",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ talk_mode: next })
        }).catch(function () {});
      }
      modeComputer.addEventListener("click", function () { persistTalkMode("computer"); });
      modeTerminal.addEventListener("click", function () { persistTalkMode("terminal"); });

      fetch("/api/jarvis/settings", { credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (data) { applyTalkMode(data && data.talk_mode); })
        .catch(function () { applyTalkMode("computer"); });

      applyTalkMode("computer");
    })();
  </script>
</body>
</html>
