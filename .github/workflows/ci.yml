name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        # TODO(#129): flip continue-on-error to false once the pre-existing
        # failures on main are fixed; this job must gate merges.
        continue-on-error: true
        run: pytest -q
      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check app tests
      - name: Type check (mypy)
        continue-on-error: true
        run: mypy app

  lint-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Fatal-error lint pass (E9,F63,F7,F82) must stay clean
        run: ruff check --select E9,F63,F7,F82 app tests scripts
