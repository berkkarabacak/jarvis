<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Talk orb 72px proof</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #008080;
    }
    #desktop {
      position: relative;
      width: 720px;
      height: 420px;
      background: #008080;
    }
    #mic {
      position: absolute;
      left: 300px;
      top: 300px;
      width: 72px;
      height: 72px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
      filter: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #orb {
      display: block;
      position: relative;
      width: 72px;
      height: 72px;
      pointer-events: none;
    }
    #orb .orb-canvas {
      display: block;
      width: 72px;
      height: 72px;
      pointer-events: none;
    }
    #more {
      position: absolute;
      left: 384px;
      top: 320px;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #1a1a1a;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #more svg { display: block; width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div id="desktop">
    <button type="button" id="mic" data-voice="listening" aria-label="Mute me">
      <span id="orb" aria-hidden="true"></span>
    </button>
    <button type="button" id="more" aria-label="More">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="6" cy="12" r="1.8"/>
        <circle cx="12" cy="12" r="1.8"/>
        <circle cx="18" cy="12" r="1.8"/>
      </svg>
    </button>
  </div>
  <script src="../deploy/jarvis-public/voice-orb.js"></script>
  <script>
    var host = document.getElementById("orb");
    window.JarvisVoiceOrb.mount(host, { size: "float", state: "listening", renderer: "canvas2d" });
    function sample() {
      var canvas = host.querySelector("canvas");
      if (!canvas || !canvas.width) {
        requestAnimationFrame(sample);
        return;
      }
      var ctx = canvas.getContext("2d", { willReadFrequently: true });
      if (!ctx) return;
      var w = canvas.width, h = canvas.height;
      var img = ctx.getImageData(0, 0, w, h);
      var d = img.data;
      var cx = Math.floor(w / 2), cy = Math.floor(h / 2);
      var i = (cy * w + cx) * 4;
      var center = [d[i], d[i + 1], d[i + 2], d[i + 3]];
      var n = 0, r = 0, g = 0, b = 0, minL = 1, maxL = 0, pink = 0, cyan = 0, white = 0;
      var x, y, p, luma, rr, gg, bb, aa;
      for (y = 0; y < h; y++) {
        for (x = 0; x < w; x++) {
          p = (y * w + x) * 4;
          aa = d[p + 3];
          if (aa < 40) continue;
          rr = d[p]; gg = d[p + 1]; bb = d[p + 2];
          luma = (0.2126 * rr + 0.7152 * gg + 0.0722 * bb) / 255;
          n += 1; r += rr; g += gg; b += bb;
          if (luma < minL) minL = luma;
          if (luma > maxL) maxL = luma;
          if (rr > 170 && bb > 170 && gg < 210) pink += 1;
          if (gg > 140 && bb > 170 && rr < 160) cyan += 1;
          if (rr > 245 && gg > 245 && bb > 245) white += 1;
        }
      }
      document.body.dataset.renderer = canvas.dataset.renderer || "";
      document.body.dataset.center = center.join(",");
      document.body.dataset.mean = n ? [Math.round(r / n), Math.round(g / n), Math.round(b / n)].join(",") : "0,0,0";
      document.body.dataset.luma = minL.toFixed(3) + ":" + maxL.toFixed(3);
      document.body.dataset.pink = String(pink);
      document.body.dataset.cyan = String(cyan);
      document.body.dataset.white = String(white);
      document.body.dataset.ready = "1";
    }
    setTimeout(function () { requestAnimationFrame(sample); }, 220);
  </script>
</body>
</html>
