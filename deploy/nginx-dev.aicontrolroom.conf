# AI Control Room — dev.aicontrolroom.nl
#
# Install as /etc/nginx/sites-available/dev.aicontrolroom  (matches the existing
# site naming on this host: `aicontrolroom` for prod, `dev.aicontrolroom` for dev).
#
# This REPLACES the current static-root site at /var/www/dev.aicontrolroom with a
# reverse proxy to the app. Back the old file up before overwriting — bootstrap.sh
# does this automatically.
#
# Port map on this VM:
#   127.0.0.1:8897  prod app  (aicontrolroom.nl)      — leave alone
#   127.0.0.1:8896  dev app   (dev.aicontrolroom.nl)  — this file
#
# Three proxy headers below are load-bearing, not boilerplate:
#
#   X-Real-IP          The public rate limiter derives its pseudonymous subject
#                      key from this. Without it every visitor collapses into ONE
#                      quota bucket and the 21st visitor per hour is refused a
#                      guest session.
#   X-Forwarded-Proto  The same-origin CSRF guard rebuilds the expected Origin
#                      from this. Without it every POST /api/public/* returns
#                      403 "Browser mutation rejected" behind TLS. Reproduced.
#   X-Forwarded-Host   Same guard, host half.
#
# TLS is not optional: the guest session cookie is __Host- prefixed and Secure,
# so over plain HTTP no session persists and chat cannot work.

upstream ai_control_room_dev {
    server 127.0.0.1:8896;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.aicontrolroom.nl;

    # certbot HTTP-01 challenge. Keep this ahead of the proxy.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.aicontrolroom.nl;

    # Populated by: certbot --nginx -d dev.aicontrolroom.nl
    ssl_certificate     /etc/letsencrypt/live/dev.aicontrolroom.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.aicontrolroom.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No HSTS on dev: a long max-age on a subdomain you may want to serve
    # differently later is hard to walk back.

    # Keep dev out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    client_max_body_size 5M;

    # Server-Sent Events: the control plane streams mission events at
    # /api/control-plane/v1/missions/{id}/events/stream. Buffering here would
    # hold events until the response closed.
    location /api/control-plane/v1/ {
        proxy_pass http://ai_control_room_dev;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://ai_control_room_dev;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_buffering off;
        # One public executive turn is bounded at 90s server-side; allow headroom.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
