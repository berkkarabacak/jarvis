# AI Control Room — aicontrolroom.nl
#
# Root-hosted vhost (NOT path-prefixed like the legacy /agent-orchestrator/
# fragment, which stays as-is on berkkarabacak.com). Install to
# /etc/nginx/sites-available/aicontrolroom.nl and symlink into sites-enabled.
#
# For a dev host instead, copy this file, change server_name to
# dev.aicontrolroom.nl, point the upstream at a second port, and issue a
# separate certificate. dev.aicontrolroom.nl has no DNS record today.
#
# Three proxy headers below are load-bearing, not boilerplate:
#
#   X-Real-IP          The public rate limiter derives its pseudonymous subject
#                      key from this. Without it every visitor on the internet
#                      collapses into ONE quota bucket and the 21st visitor per
#                      hour is refused a guest session.
#   X-Forwarded-Proto  The same-origin CSRF guard rebuilds the expected Origin
#                      from this. Without it every POST /api/public/* returns
#                      403 "Browser mutation rejected" behind TLS. Reproduced.
#   X-Forwarded-Host   Same guard, host half.
#
# TLS is not optional: the guest session cookie is __Host- prefixed and Secure,
# so over plain HTTP no session ever persists and chat cannot work.

upstream ai_control_room {
    server 127.0.0.1:8896;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aicontrolroom.nl www.aicontrolroom.nl;

    # certbot writes its challenge here; everything else goes to TLS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aicontrolroom.nl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aicontrolroom.nl;

    ssl_certificate     /etc/letsencrypt/live/aicontrolroom.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicontrolroom.nl/privkey.pem;

    # Single canonical origin. The CSRF guard compares against one Origin, so
    # serving the app on both apex and www would 403 half the visitors.
    return 301 https://aicontrolroom.nl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aicontrolroom.nl;

    # Populated by: certbot --nginx -d aicontrolroom.nl -d www.aicontrolroom.nl
    ssl_certificate     /etc/letsencrypt/live/aicontrolroom.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicontrolroom.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5M;

    # Talk is the public home page. Do not proxy all of / to 8896 — that
    # swallows /jarvis/ and keeps / as the old CEO redirect.
    location = / {
        return 302 /jarvis/;
    }

    # Old AI Control Room health (8896).
    location = /health {
        proxy_pass http://ai_control_room;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # Old CEO UI and its assets. Prefix match so /ceo and /ceo/ stay on 8896.
    location ^~ /ceo {
        proxy_pass http://ai_control_room;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_buffering off;
        # One public executive turn is bounded at 90s server-side; allow headroom.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Server-Sent Events: the control plane streams mission events at
    # /api/control-plane/v1/missions/{id}/events/stream. Buffering here would
    # hold events until the response closed.
    location /api/control-plane/v1/ {
        proxy_pass http://ai_control_room;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Public Jarvis Talk (https://aicontrolroom.nl/jarvis/). Same locations as
    # deploy/nginx-jarvis-public.fragment (alias on berkkarabacak.com/jarvis/).
    # Windows installer stays on disk. Do not proxy the exe through the app.
    location ^~ /jarvis/download/ {
        alias /var/www/jarvis/download/;
    }

    # Android watch (ORCH-461). Same Talk iframe path, different box.
    # localhost only — do not publish the Android screen on all interfaces.
    location ^~ /jarvis/android/ {
        proxy_pass http://127.0.0.1:6081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Same live noVNC session, never bind 0.0.0.0:6080.
    location ^~ /jarvis/novnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /jarvis { return 301 $scheme://$host/jarvis/; }
    location /jarvis/ {
        proxy_pass http://127.0.0.1:8895/jarvis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 180s;
        client_max_body_size 5M;
    }
}
